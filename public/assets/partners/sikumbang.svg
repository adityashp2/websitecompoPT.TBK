    <path d="M12 20 L24 10 L36 20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="27" r="4" fill="#FF9D2E"/>
    <!-- Text -->
    <text x="50" y="27" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#0D9488" letter-spacing="-0.5">SiKumbang</text>
    <text x="50" y="41" font-family="'DM Sans', 'Arial', sans-serif" font-weight="600" font-size="8.5" fill="#526783" letter-spacing="0.5">SISTEM PENGEMBANG PUPR</text>
  </g>
